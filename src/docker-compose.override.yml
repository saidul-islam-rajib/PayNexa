x-service-defaults: &service-defaults
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: "8080"
  PayNexaLogging__SeqServerUrl: http://seq:5341
  PayNexaLogging__ConsoleFormat: Text
  Observability__OtlpTracesEndpoint: http://seq:5341/ingest/otlp/v1/traces
  MongoDb__ConnectionString: mongodb://mongodb:27017
  Redis__ConnectionString: redis:6379
  SqlServer__ApplyMigrationsOnStartup: "true"

services:
  sqlserver:
    container_name: sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  mongodb:
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  seq:
    container_name: seq
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:5341"
      - "5342:80"
    volumes:
      - seq_data:/data

  paynexa.apigateway:
    container_name: paynexa.apigateway
    environment:
      <<: *service-defaults
    depends_on: [seq, redis, authentication.api, customer.api, payment.api, transaction.api]
    ports:
      - "8000:8080"

  authentication.api:
    container_name: authentication.api
    environment:
      <<: *service-defaults
      MongoDb__DatabaseName: paynexa_auth
      ConnectionStrings__AuthDb: Server=sqlserver;Database=AuthDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on: [seq, sqlserver, mongodb, redis]
    ports:
      - "8001:8080"

  customer.api:
    container_name: customer.api
    environment:
      <<: *service-defaults
      MongoDb__DatabaseName: paynexa_customer
      ConnectionStrings__CustomerDb: Server=sqlserver;Database=CustomerDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on: [seq, sqlserver, mongodb, redis]
    ports:
      - "8002:8080"

  payment.api:
    container_name: payment.api
    environment:
      <<: *service-defaults
      MongoDb__DatabaseName: paynexa_payment
      ConnectionStrings__PaymentDb: Server=sqlserver;Database=PaymentDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on: [seq, sqlserver, mongodb, redis]
    ports:
      - "8003:8080"

  transaction.api:
    container_name: transaction.api
    environment:
      <<: *service-defaults
      MongoDb__DatabaseName: paynexa_transaction
      ConnectionStrings__TransactionDb: Server=sqlserver;Database=TransactionDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on: [seq, sqlserver, mongodb, redis]
    ports:
      - "8004:8080"

  notification.api:
    container_name: notification.api
    environment:
      <<: *service-defaults
      MongoDb__DatabaseName: paynexa_notification
      ConnectionStrings__NotificationDb: Server=sqlserver;Database=NotificationDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on: [seq, sqlserver, mongodb, redis]
    ports:
      - "8005:8080"
